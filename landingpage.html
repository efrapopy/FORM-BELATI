<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belati - HIMTIF Universitas Raharja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1f2937 100%);
      min-height: 100vh;
      overflow: hidden;
      color: white;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem 1rem;
    }
    .glow-text {
      text-shadow: 
        0 0 25px #facc15,
        0 0 50px #eab308,
        0 0 80px rgba(250, 204, 21, 0.6);
    }
    .logo-img {
      filter: drop-shadow(0 15px 35px rgba(250, 204, 21, 0.5));
      transition: transform 0.4s ease;
    }
    .logo-img:hover {
      transform: scale(1.05);
    }
    .university-text {
      font-size: 1.15rem;
      letter-spacing: 3px;
      color: #94a3b8;
      font-weight: 500;
    }
    .btn-daftar {
      background: linear-gradient(90deg, #eab308, #facc15);
      color: #111827;
      transition: all 0.4s ease;
    }
    .btn-daftar:hover {
      transform: scale(1.08) translateY(-5px);
      box-shadow: 0 0 50px #facc15;
    }
    .particle {
      position: absolute;
      background: rgba(250, 204, 21, 0.4);
      border-radius: 50%;
      animation: particleFloat 30s linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(0) scale(1); opacity: 0.7; }
      100% { transform: translateY(-140vh) scale(0.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <!-- Particles Background -->
    <div id="particles" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <div class="text-center z-10 max-w-2xl mx-auto">
      
      <!-- Logo HIMTIF (lebih kecil di atas) -->
      <div class="flex justify-center mb-8">
        <img src="logo himtif.png" alt="Logo HIMTIF Universitas Raharja" 
             class="logo-img w-40 h-40 object-contain">
      </div>

      <!-- Judul BELATI -->
      <h1 class="text-[5.5rem] md:text-[6.8rem] font-black tracking-[-4px] glow-text text-white mb-3 leading-none">
        BELATI
      </h1>

      <p class="text-3xl md:text-4xl text-yellow-100 font-light tracking-wide mb-4">
        BELAJAR TEKNIK INFORMATIKA
      </p>
      
      <!-- Himpunan -->
      <p class="text-blue-200 text-2xl font-semibold tracking-wider mb-2">
        HIMPUNAN MAHASISWA TEKNIK INFORMATIKA
      </p>
      
      <!-- Universitas Raharja - Versi yang sudah dibagusin -->
      <p class="university-text text-2xl">
        UNIVERSITAS RAHARJA
      </p>

      <!-- Tombol Daftar -->
      <a href="form.html" 
         class="btn-daftar mt-16 inline-flex items-center gap-6 text-2xl font-bold px-24 py-8 rounded-3xl shadow-2xl">
        DAFTAR SEKARANG
        <i class="fas fa-arrow-right text-3xl"></i>
      </a>

      <!-- Keterangan Bawah -->
      <div class="mt-20 text-yellow-100/70 text-sm tracking-[3px] font-medium">
        PROGRAM BELAJAR • WEB DASAR • PHP NATIVE • FRAMEWORK PHP
      </div>
    </div>
  </div>

  <script>
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 6 + 3;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.top = `${Math.random() * 100}vh`;
        particle.style.animationDuration = `${Math.random() * 28 + 22}s`;
        particle.style.animationDelay = `-${Math.random() * 40}s`;
        container.appendChild(particle);
      }
    }
    window.onload = createParticles;
  </script>
</body>
</html>
