<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabung Grup WhatsApp - BELATI HIMTIF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    body { 
      background: #0a0a0a; 
      color: white; 
      font-family: system-ui, -apple-system, sans-serif;
    }
    .wa-logo {
      filter: drop-shadow(0 0 40px #25D366);
    }
    .wa-green { 
      background: #25D366; 
      transition: all 0.3s ease;
    }
    .wa-green:hover { 
      background: #128C7E; 
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.5);
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
    }
    .back-btn {
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background-color: #1f2937;
      color: #facc15;
      transform: translateY(-2px);
      border-color: #facc15;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center">
    
    <!-- Logo WhatsApp -->
    <div class="mb-8">
      <i class="fab fa-whatsapp text-[130px] text-[#25D366] wa-logo"></i>
    </div>

    <!-- Judul -->
    <h1 id="welcomeText" class="text-4xl font-bold mb-10 leading-tight"></h1>

    <!-- Kotak Informasi -->
    <div class="card rounded-3xl p-8 mb-10 text-left">
      <p class="text-gray-300 mb-6 text-[17px] leading-relaxed">
        Yuk gabung ke grup WhatsApp sesuai level yang kamu pilih.
      </p>
      <p class="text-gray-300 text-[17px] leading-relaxed">
        Di grup ini kamu akan mendapatkan materi, pengumuman, dan diskusi bareng teman-teman.
      </p>
    </div>

    <!-- Tombol Gabung Grup -->
    <a id="waButton" 
       href="#" 
       target="_blank"
       class="wa-green text-white font-bold text-xl py-5 px-10 rounded-2xl inline-flex items-center justify-center gap-3 shadow-2xl w-full max-w-xs mx-auto mb-12">
      <i class="fab fa-whatsapp text-4xl"></i>
      <span>Gabung Grup WhatsApp</span>
    </a>

    <!-- Tombol Kembali ke Beranda (Sudah dibagusin) -->
    <a href="landingpage.html" 
       class="back-btn inline-flex items-center gap-3 px-8 py-4 border-2 border-gray-600 rounded-2xl text-gray-300 hover:text-yellow-300 font-medium text-lg">
      <i class="fas fa-arrow-left text-xl"></i>
      <span>Kembali ke Beranda</span>
    </a>

    <!-- Catatan Bawah -->
    <div class="mt-12 text-gray-400 text-sm">
      <p>Link ini hanya berlaku untukmu.</p>
      <p>Jika ada kendala, hubungi panitia melalui WA pribadi.</p>
    </div>
  </div>

  <script>
    const nama = localStorage.getItem("belati_nama") || "Sahabat BELATI";
    const levelId = localStorage.getItem("belati_level");

    document.getElementById("welcomeText").innerHTML = 
      `Selamat bergabung di BELATI <span class="text-yellow-300">${nama}</span>!`;

    // GANTI LINK GRUP WHATSAPP DI SINI
    const groupLinks = {
      "dasar": "https://chat.whatsapp.com/XXXXXXXXXXXXXXXXXXXX",     // Web Dasar
      "php": "https://chat.whatsapp.com/XXXXXXXXXXXXXXXXXXXX",       // PHP Native
      "framework": "https://chat.whatsapp.com/XXXXXXXXXXXXXXXXXXXX"  // Framework PHP
    };

    const button = document.getElementById("waButton");
    
    if (levelId && groupLinks[levelId]) {
      button.href = groupLinks[levelId];
    } else {
      button.href = "#";
      button.innerHTML = `<i class="fab fa-whatsapp text-4xl"></i><span>Hubungi Panitia</span>`;
      button.style.backgroundColor = "#ef4444";
    }
  </script>
</body>
</html>
