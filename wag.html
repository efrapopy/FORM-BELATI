<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gabung Grup WhatsApp - BELATI HIMTIF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    body { 
      background: #0a0a0a; 
      color: white; 
    }
    .wa-logo {
      filter: drop-shadow(0 0 35px #25D366);
    }
    .wa-green { 
      background: #25D366; 
      transition: all 0.3s ease;
    }
    .wa-green:hover { 
      background: #128C7E; 
      transform: translateY(-3px);
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">

  <div class="max-w-md w-full text-center">
    <div class="mb-8">
      <i class="fab fa-whatsapp text-[92px] md:text-[110px] text-[#25D366] wa-logo"></i>
    </div>

    <h1 id="welcomeText" class="text-3xl md:text-4xl font-bold mb-10 leading-tight"></h1>

    <div class="card rounded-3xl p-7 mb-10 text-left">
      <p class="text-gray-300 mb-5 text-[15.5px]">Yuk gabung ke grup WhatsApp sesuai level yang kamu pilih.</p>
      <p class="text-gray-300 text-[15.5px]">Di grup ini kamu akan mendapatkan materi, pengumuman, dan diskusi bareng teman-teman.</p>
    </div>

    <a id="waButton" href="#" target="_blank"
       class="wa-green text-white font-bold text-lg py-5 px-10 rounded-2xl inline-flex items-center justify-center gap-3 shadow-xl w-full max-w-xs mx-auto mb-12">
      <i class="fab fa-whatsapp text-4xl"></i>
      <span>Gabung Grup WhatsApp</span>
    </a>

    <a href="index.html" 
       class="inline-flex items-center gap-3 px-8 py-4 border-2 border-gray-600 rounded-2xl text-gray-300 hover:text-yellow-300 font-medium">
      <i class="fas fa-arrow-left"></i>
      <span>Kembali ke Beranda</span>
    </a>

    <div class="mt-12 text-gray-400 text-sm">
      <p>Link ini hanya berlaku untukmu.</p>
      <p>Jika ada kendala, hubungi panitia melalui WA pribadi.</p>
    </div>
  </div>

  <script>
    const nama = localStorage.getItem("belati_nama") || "Sahabat BELATI";
    const levelId = localStorage.getItem("belati_level");

    document.getElementById("welcomeText").innerHTML = 
      `Selamat bergabung di BELATI <span class="text-yellow-300">${nama}</span>!`;

    const groupLinks = {
      "dasar": "https://chat.whatsapp.com/XXXXXXXXXXXXXXXXXXXX",
      "php": "https://chat.whatsapp.com/XXXXXXXXXXXXXXXXXXXX",
      "framework": "https://chat.whatsapp.com/XXXXXXXXXXXXXXXXXXXX"
    };

    const button = document.getElementById("waButton");
    if (levelId && groupLinks[levelId]) {
      button.href = groupLinks[levelId];
    } else {
      button.href = "#";
      button.innerHTML = `<i class="fab fa-whatsapp text-4xl"></i><span>Hubungi Panitia</span>`;
      button.style.backgroundColor = "#ef4444";
    }
  </script>
</body>
</html>
